name: Deploy to Cloudflare Pages

# MANUAL FALLBACK ONLY (workspace CLAUDE.md §4a, 2026-09-24). CI is the local ci-local gate (scripts/ci-steps.sh,
# posted as the ci-local commit status). This workflow no longer runs on push or pull_request; invoke it by
# hand with `gh workflow run <file>` if the gate machine is down.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx next build
      # Deploy handled manually via wrangler CLI for now
      - name: Build complete
        run: echo "Build successful — deploy via wrangler CLI"
